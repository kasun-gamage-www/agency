[package]
name = "agency-desktop"
version = "0.1.0"
edition = "2021"
description = "Multi-repo git workspace manager with a native GUI"

[dependencies]
eframe = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
